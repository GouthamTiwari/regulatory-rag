[project]
name = "regrag"
version = "0.1.0"
description = "Hybrid-search RAG over RBI and GST regulations, with citations, supersession flags and abstention."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.44.3",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "truststore>=0.10",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
# uv's own build backend: it understands the src/ layout with no extra config.
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# Lets the import sorter (rule I) know that `regrag` is our own package.
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: real errors, I: import order, UP: modern Python syntax, B: common bug patterns.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
# Ruff also formats Python snippets inside Markdown. Our docs show short, aligned
# examples for reading, not runnable code, so the formatter leaves .md files alone.
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Plain `uv run pytest` must be free and need no Docker, so the two costly groups are opt-in.
addopts = '-m "not live and not db"'
markers = [
    "live: calls real Amazon Bedrock, costs money",
    "db: needs the Docker Postgres",
]
